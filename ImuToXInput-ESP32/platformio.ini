; ImuToXInput-ESP32: WiFi provisioning, SolarXR client, USB HID Xbox 360 gamepad, config files
; Use a board with native USB (ESP32-S2 or ESP32-S3) for HID. Change default_envs if needed.
; SolarXR-Protocol: git submodule at repo root (run: git submodule update --init --recursive)

[env:esp32-s2-saola-1]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200

; Native USB (for HID). Use this for ESP32-S2 Saola or similar.
board_build.f_cpu = 240000000L

; Uncomment and set to your dongle's board if different, e.g.:
; [env:esp32-s3-devkitc-1]
; platform = espressif32
; board = esp32-s3-devkitc-1
; framework = arduino

lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    gilmaimon/ArduinoWebsockets@^0.5.3
    $PROJECT_DIR/../SolarXR-Protocol

; PICO-D4 (MuseLab dongle): BLE gamepad output only (no native USB)
; Use for development while waiting for S3 hardware.
[env:esp32-pico-d4]
platform = espressif32
board = esp32-pico-kit
framework = arduino
monitor_speed = 115200
build_flags =
    -DUSE_BLE_GAMEPAD
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    lemmingDev/ESP32-BLE-Gamepad@^0.5.2
    h2zero/NimBLE-Arduino@^2.1.0
    gilmaimon/ArduinoWebsockets@^0.5.3
    $PROJECT_DIR/../SolarXR-Protocol

; Optional: partition for LittleFS and configs
; board_build.partitions = default.csv
